name: Build RAX3000M eMMC OpenWrt with NAS & Docker

on:
  workflow_dispatch:
    inputs:
      none:
        description: 'Manual build trigger'
        required: false

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev liblzo2-dev \
          libncurses5-dev libsqlite3-dev m4 libssl-dev msmtp nano ninja-build p7zip p7zip-full patch pkg-config \
          python3 python3-pip python3-ply python-is-python3 qemu-utils re2c rsync subversion swig texinfo \
          uglifyjs upx-ucl uuid-dev wget xsltproc zlib1g-dev
        sudo docker rmi $(docker image ls -q) 2>/dev/null || true
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone Official Source Code
      working-directory: /workdir
      run: |
        git clone -b openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git openwrt
        cd openwrt
        echo "OPENWRT_PATH=$(pwd)" >> $GITHUB_ENV

    - name: Update & Install Feeds
      working-directory: ${{ env.OPENWRT_PATH }}
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate Configuration (.config) with Plugins
      working-directory: ${{ env.OPENWRT_PATH }}
      run: |
        # 1. 基础平台选择 mediatek/mt7981
        echo "CONFIG_TARGET_mediatek=y" > .config
        echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
        # 2. 精确指定 RAX3000M eMMC 设备的 Profile（避免多余镜像打包导致报错）
        echo "CONFIG_TARGET_DEVICE_mediatek_mt7981_device_cmcc_rax3000m-emmc=y" >> .config

        # 3. 基础必备组件与 NAS / Docker 支持
        echo "CONFIG_PACKAGE_docker=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config
        echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb3=y" >> .config

        # 4. 自动生成默认配置
        make defconfig

    - name: Compile Firmware
      working-directory: ${{ env.OPENWRT_PATH }}
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files
      id: organize
      if: success()
      run: |
        cd ${{ env.OPENWRT_PATH }}/bin/targets/mediatek/mt7981*
        rm --packages 2>/dev/null || true
        echo "FIRMWARE=$(pwd)" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to Release
      uses: softprops/action-gh-release@v1
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        tag_name: rax3000m-emmc-$(date +%Y%m%d)
        name: RAX3000M eMMC ImmortalWrt ($(date +%Y-%m-%d))
        files: ${{ env.FIRMWARE }}/*sysupgrade.bin
        body: |
          ### RA3000M eMMC 专属定制固件
          - 包含 Docker 与 NAS 组件
          - 适配 1024MB GPT 大分区
          - 对应物理 MAC 地址与硬件架构
