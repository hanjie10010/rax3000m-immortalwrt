name: Build RAX3000M eMMC OpenWrt with NAS & Docker

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish to GitHub Releases'
        required: false
        default: 'true'
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  FEEDS_CONF: feeds.conf.default
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/mac-setup
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang llvm flex bison gawk gettext python3-setuptools libssl-dev libncurses5-dev libncursesw5-dev zlib1g-dev git scons python3-pyelftools unzip libelf-dev swig rsync
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone Official Source Code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone -b ${{ env.REPO_BRANCH }} --single-branch ${{ env.REPO_URL }} openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate Configuration (.config) with Plugins
      run: |
        cd openwrt
        cat <<EOF > .config
        # 1. 基础硬件架构 (MT7981 eMMC 版)
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_mt7981=y
        CONFIG_TARGET_mediatek_mt7981_DEVICE_cmcc_rax3000m-emmc=y
        
        # 2. 系统与中文语言
        CONFIG_PACKAGE_luci=y
        CONFIG_LUCI_LANG_zh_Hans=y

        # 3. 磁盘管理与文件系统支持
        CONFIG_PACKAGE_kmod-fs-ext4=y
        CONFIG_PACKAGE_kmod-fs-f2fs=y
        CONFIG_PACKAGE_kmod-fs-ntfs3=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        CONFIG_PACKAGE_fdisk=y
        CONFIG_PACKAGE_e2fsprogs=y
        CONFIG_PACKAGE_blkid=y
        CONFIG_PACKAGE_lsblk=y
        CONFIG_PACKAGE_luci-app-diskman=y

        # 4. Docker 容器支持
        CONFIG_PACKAGE_docker=y
        CONFIG_PACKAGE_dockerd=y
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_kmod-netfilter-nat-rtsp=y

        # 5. NAS 网络共享套件 (Samba 4)
        CONFIG_PACKAGE_luci-app-samba4=y
        CONFIG_PACKAGE_autosamba=y
        EOF
        make defconfig

    - name: Compile Firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) CPU cores, starting compilation..."
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize Files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/mediatek/mt7981
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to Release
      uses: softprops/action-gh-release@v1
      if: steps.organize.outputs.status == 'success' && inputs.release == 'true' && !cancelled()
      with:
        tag_name: RAX3000M_eMMC_NAS_Docker_${{ github.run_id }}
        files: ${{ env.FIRMWARE }}/*sysupgrade.bin
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          ### RAX3000M eMMC 固件更新 (含 Docker、磁盘管理、NAS)
          - 源码仓库: 官方 ImmortalWrt (${{ env.REPO_BRANCH }})
          - 已集成套件:
            - 磁盘管理 (luci-app-diskman)
            - Docker 容器管理 (luci-app-dockerman)
            - Samba NAS 文件共享 (luci-app-samba4)
            - 存储驱动 (ext4, f2fs, ntfs3)
